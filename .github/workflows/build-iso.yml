name: Build ISO

# Builds a ready-to-flash HelloOS ISO (Linux Mint XFCE + HelloOS).
# Runs on every version tag (v0.1.0, v0.2.0, …) or by hand:
#   Actions → Build ISO → Run workflow
# The ISO is attached to the run as an artifact (download from the run page).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mint_version:
        description: "Linux Mint version (e.g. 22.3). Empty = newest available."
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MIRROR: https://mirrors.edge.kernel.org/linuxmint/stable
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y xorriso squashfs-tools

      - name: Download Linux Mint XFCE
        id: mint
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.mint_version }}"
          if [ -z "$VERSION" ]; then
            # Newest version that has an XFCE image on the mirror
            for v in $(curl -fsSL "$MIRROR/" | grep -oE 'href="[0-9]+(\.[0-9]+)?/"' \
                       | grep -oE '[0-9]+(\.[0-9]+)?' | sort -Vr); do
              if curl -fsIL "$MIRROR/$v/linuxmint-$v-xfce-64bit.iso" >/dev/null; then
                VERSION=$v; break
              fi
            done
          fi
          [ -n "$VERSION" ] || { echo "No Linux Mint XFCE image found"; exit 1; }
          ISO="linuxmint-$VERSION-xfce-64bit.iso"
          echo "Linux Mint $VERSION"
          curl -fL --retry 3 -o "$ISO" "$MIRROR/$VERSION/$ISO"
          curl -fsSL "$MIRROR/$VERSION/sha256sum.txt" | grep -E "[ *]${ISO}\$" | sha256sum -c -
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "iso=$ISO" >> "$GITHUB_OUTPUT"

      - name: Build HelloOS ISO
        id: build
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then NAME="${GITHUB_REF_NAME}"; else NAME="$(date +%Y%m%d)-${GITHUB_SHA::7}"; fi
          OUT="helloos-${NAME}-mint${{ steps.mint.outputs.version }}.iso"
          sudo ./build-iso/build-iso.sh "${{ steps.mint.outputs.iso }}" "$OUT"
          sudo chown "$(id -u):$(id -g)" "$OUT"
          rm -f "${{ steps.mint.outputs.iso }}"
          sha256sum "$OUT" > "$OUT.sha256"
          ls -lh "$OUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.out }}
          path: |
            ${{ steps.build.outputs.out }}
            ${{ steps.build.outputs.out }}.sha256
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "## HelloOS ISO is ready"
            echo
            echo "**${{ steps.build.outputs.out }}** (Linux Mint ${{ steps.mint.outputs.version }})"
            echo
            echo "Download it from **Artifacts** at the bottom of this page, unzip, and write the .iso"
            echo "to a USB stick with Rufus, Balena Etcher or Ventoy."
          } >> "$GITHUB_STEP_SUMMARY"
